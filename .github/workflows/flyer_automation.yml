name: Generar Flyers Automaticamente

on:
  schedule:
    - cron: '0 20 * * *' # 3 PM Hora Perú
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # [!] Margen de 2 horas para procesos masivos y subidas pesadas
    strategy:
      matrix:
        rango: [
          {i: 0, f: 25}, {i: 25, f: 50}, {i: 50, f: 75}, {i: 75, f: 100},
          {i: 100, f: 125}, {i: 125, f: 150}, {i: 150, f: 175}, {i: 175, f: 200},
          {i: 200, f: 220}, {i: 220, f: 240}, 
          {i: 240, f: 245}, 
          {i: 245, f: 255}
        ]
      fail-fast: false # [!] Clave: Si el bloque pesado falla, los demás terminan su trabajo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerias
        run: |
          pip install pandas requests Pillow gspread oauth2client google-api-python-client google-auth-oauthlib google-auth-httplib2 || (sleep 10 && pip install pandas requests Pillow gspread oauth2client google-api-python-client google-auth-oauthlib google-auth-httplib2)

      - name: Ejecutar Bloque (${{ matrix.rango.i }} - ${{ matrix.rango.f }})
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          PYTHONUNBUFFERED: 1 
          PYTHONDONTWRITEBYTECODE: 1
          # [!] AJUSTES SENIOR DE INFRAESTRUCTURA
          PYTHONIOENCODING: utf-8
          MALLOC_ARENA_MAX: 2  # Previene la fragmentación de RAM en procesos de alto volumen de imágenes
          NODE_OPTIONS: "--max-old-space-size=4096" # Optimiza el orquestador interno de GitHub
        run: |
          # [!] REGLA DE ORO: Prioridad para la Máquina 0
          # Si NO soy la máquina 0, espero 60 segundos adicionales.
          # Esto permite que la máquina 0 limpie las hojas duplicadas "Hoja2 (x)" 
          # y resetee la maestra sin que las otras máquinas causen colisiones de lectura.
          if [ ${{ matrix.rango.i }} -ne 0 ]; then
            echo ">>> [ESPERA ESTRATÉGICA] Dando tiempo a la Máquina 0 para mantenimiento de Sheets..."
            sleep 60
          fi

          # [!] AJUSTE DE ESPERA (Factor 5)
          TOTAL_ESPERA=$(( (${{ matrix.rango.i }} / 25) * 5 ))
          echo ">>> [!] INICIO SEGURO: Espera de $TOTAL_ESPERA segundos..."
          
          CONTADOR=0
          while [ $CONTADOR -lt $TOTAL_ESPERA ]; do
            echo ">>> [STAY ALIVE] Preparando entorno masivo... ($((TOTAL_ESPERA - CONTADOR))s restantes)"
            sleep 30
            CONTADOR=$((CONTADOR + 30))
          done
          
          # [!] OPTIMIZACIÓN DE BUFFER PARA SUBIDAS DE ARCHIVOS GRANDES (300MB+)
          git config --global http.postBuffer 1048576000
          git config --global core.compression 0
          
          # Limpieza e higiene de carpetas temporales
          rm -rf temp_flyers temp_cache_img
          mkdir -p temp_flyers temp_cache_img
          
          # [!] LÓGICA DE EJECUCIÓN CON CONTINGENCIA
          # El bloque 240 es crítico: procesa el PDF más grande y requiere toda la RAM limpia.
          if [ ${{ matrix.rango.i }} -eq 240 ]; then
            echo ">>> [ZONA CRÍTICA] Generando PDF de alto volumen (Páginas completas)..."
            python -u generar_flyers.py ${{ matrix.rango.i }} ${{ matrix.rango.f }}
          else
            python -u generar_flyers.py ${{ matrix.rango.i }} ${{ matrix.rango.f }} || (echo ">>> Fallo detectado. Reintentando bloque secundario..." && sleep 15 && python -u generar_flyers.py ${{ matrix.rango.i }} ${{ matrix.rango.f }})
          fi