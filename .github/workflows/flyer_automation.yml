name: Generar Flyers Automaticamente

on:
  schedule:
    - cron: '0 20 * * *' # 3 PM Hora Perú
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # Le damos permiso de durar hasta 4 horas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerias
        run: |
          pip install pandas requests Pillow gspread oauth2client google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Ejecutar Script de Flyers
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          # Esto soluciona el aviso de Node.js 20
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
        # La -u es vital para que GitHub no "cancele" el proceso por inactividad
        run: python -u generar_flyers.py