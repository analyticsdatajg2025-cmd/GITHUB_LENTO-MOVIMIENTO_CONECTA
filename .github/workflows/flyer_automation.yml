name: Generar Flyers Automaticamente

on:
  schedule:
    - cron: '0 20 * * *' # 3 PM Hora Perú
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 

      - name: Instalar librerias
        run: pip install -r requirements.txt 

      - name: Limpiar y Preparar Directorios
        run: |
          mkdir -p docs/flyers
          mkdir -p temp_cache_img
          # Limpieza profunda de los archivos de ayer para que Git no sufra comparando
          rm -f docs/flyers/*.pdf 

      - name: Ejecutar Script de Flyers
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
        run: python generar_flyers.py

      - name: Deploy a GitHub Pages (Estrategia Anti-Error 500)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs # Sube todo lo que esté en docs/ (incluyendo flyers/)
          branch: gh-pages # Los archivos vivirán aquí, lejos de tu código
          clean: true # Borra los de ayer antes de subir los de hoy
          single-commit: true # No guarda historial pesado, solo la versión de hoy

      - name: Subir a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Desplegar
        uses: actions/deploy-pages@v4