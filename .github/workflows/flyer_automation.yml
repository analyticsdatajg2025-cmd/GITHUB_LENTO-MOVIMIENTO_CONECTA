name: Generar Flyers Automaticamente

on:
  schedule:
    - cron: '0 20 * * *' # 3 PM Hora Perú (20:00 UTC)
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Aumentamos a 6 horas por seguridad, ya que manejas 85k productos
    timeout-minutes: 360 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerias
        run: |
          pip install pandas requests Pillow gspread oauth2client google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Ejecutar Script de Flyers
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          # Soluciona el aviso de Node.js 20 de forma global
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
          # Evita que Python genere archivos .pyc innecesarios en el disco virtual
          PYTHONDONTWRITEBYTECODE: 1
        # El comando python -u es VITAL para que los logs no se queden en el buffer
        run: python -u generar_flyers.py