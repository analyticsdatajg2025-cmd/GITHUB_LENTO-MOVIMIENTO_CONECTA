name: Generar Flyers Automaticamente

on:
  schedule:
    - cron: '0 20 * * *' # 3 PM Hora Perú
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Clonado rápido sin historial pesado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera la instalación de librerías

      - name: Instalar librerias
        run: pip install -r requirements.txt # Cambiamos la lista manual por el archivo

      - name: Limpiar y Preparar Directorios
        run: |
          mkdir -p docs/flyers
          mkdir -p temp_cache_img
          # Opcional: rm -rf docs/flyers/*.pdf (Si quieres frescura total diaria)

      - name: Ejecutar Script de Flyers
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
        run: python generar_flyers.py

      - name: Commit y Push de cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # SOLUCIÓN SENIOR: Aumentar buffer para evitar desconexiones RPC/500
          git config http.postBuffer 524288000
          
          git add docs/flyers/*.pdf
          # Solo hacemos commit si hay archivos nuevos o cambios
          if git diff --staged --quiet; then
            echo "Sin cambios en los PDFs."
          else
            git commit -m "Update Flyers: $(date +'%Y-%m-%d %H:%M') [skip ci]"
            # Intentar push con reintentos en caso de saturación de red
            git push origin main || (sleep 10 && git push origin main)
          fi

      - name: Subir a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Desplegar
        uses: actions/deploy-pages@v4