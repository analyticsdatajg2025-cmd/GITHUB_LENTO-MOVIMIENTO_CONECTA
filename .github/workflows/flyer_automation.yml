name: Generar Flyers Automaticamente

on:
  schedule:
    - cron: '0 20 * * *' # 3 PM Hora Perú
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Subimos de 60 a 90 para dar margen de maniobra
    strategy:
      matrix:
        rango: [
          {i: 0, f: 25}, {i: 25, f: 50}, {i: 50, f: 75}, {i: 75, f: 100},
          {i: 100, f: 125}, {i: 125, f: 150}, {i: 150, f: 175}, {i: 175, f: 200},
          {i: 200, f: 220}, {i: 220, f: 240}, 
          {i: 240, f: 250}, # <--- Bloque ultra ligero
          {i: 250, f: 260}, # <--- Bloque ultra ligero
          {i: 260, f: 285}, {i: 285, f: 315}
        ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerias
        run: |
          pip install pandas requests Pillow gspread oauth2client google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Ejecutar Bloque (${{ matrix.rango.i }} - ${{ matrix.rango.f }})
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
          PYTHONDONTWRITEBYTECODE: 1
          PYTHONUNBUFFERED: 1 
        run: |
          # 1. Blindaje de red para subida de PDFs pesados
          git config --global http.postBuffer 1048576000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          
          # 2. Limpieza de espacio en disco del Runner
          rm -rf temp_flyers temp_cache_img
          
          # 3. Ejecución del script con el nuevo escalonamiento interno del .py
          python -u generar_flyers.py ${{ matrix.rango.i }} ${{ matrix.rango.f }}