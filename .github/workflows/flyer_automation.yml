name: Generar Flyers Automaticamente

on:
  schedule:
    - cron: '0 20 * * *' # 3 PM Hora Perú
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        rango: [
          {i: 0, f: 25}, {i: 25, f: 50}, {i: 50, f: 75}, {i: 75, f: 100},
          {i: 100, f: 125}, {i: 125, f: 150}, {i: 150, f: 175}, {i: 175, f: 200},
          {i: 200, f: 220}, {i: 220, f: 240}, 
          {i: 240, f: 245}, 
          {i: 245, f: 255}
        ]
      fail-fast: false # [!] CLAVE: Si una falla, las demás NO se detienen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerias
        run: |
          pip install pandas requests Pillow gspread oauth2client google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Ejecutar Bloque (${{ matrix.rango.i }} - ${{ matrix.rango.f }})
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
          PYTHONDONTWRITEBYTECODE: 1
          PYTHONUNBUFFERED: 1 
        run: |
          # [!] NUEVA ESPERA DINÁMICA: Mensajes cada 60s para evitar cancelación de GitHub
          TOTAL_ESPERA=$(( (${{ matrix.rango.i }} / 25) * 30 ))
          echo ">>> [!] SEGURIDAD API: Espera total programada: $TOTAL_ESPERA segundos."
          
          CONTADOR=0
          while [ $CONTADOR -lt $TOTAL_ESPERA ]; do
            RESTANTE=$((TOTAL_ESPERA - CONTADOR))
            echo ">>> [STAY ALIVE] Faltan $RESTANTE segundos para iniciar el bloque..."
            sleep 60
            CONTADOR=$((CONTADOR + 60))
          done
          
          # 1. Blindaje de red y subida masiva
          git config --global http.postBuffer 1048576000
          git config --global core.compression 0
          
          # 2. Limpieza de carpetas
          rm -rf temp_flyers temp_cache_img
          mkdir -p temp_flyers temp_cache_img
          
          # 3. Ejecución con modo Verbose para monitoreo constante
          python -u generar_flyers.py ${{ matrix.rango.i }} ${{ matrix.rango.f }}