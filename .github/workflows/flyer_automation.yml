name: Generar Flyers Automaticamente

on:
  schedule:
    - cron: '0 20 * * *' # 3 PM Hora Perú
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 

      - name: Instalar librerias
        run: pip install -r requirements.txt 

      - name: Limpiar y Preparar Directorios
        run: |
          mkdir -p docs/flyers
          mkdir -p temp_cache_img
          # Limpieza profunda de los archivos de ayer para que Git no sufra comparando
          rm -f docs/flyers/*.pdf 

      - name: Ejecutar Script de Flyers
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
        run: python generar_flyers.py

      - name: Commit y Push (Estrategia de Estabilidad Senior)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Aumentar buffer al máximo permitido para evitar desconexiones RPC
          git config http.postBuffer 524288000
          git config core.compression 0
          
          # Añadir archivos
          git add docs/flyers/*.pdf
          
          if git diff --staged --quiet; then
            echo "Sin cambios detectados."
          else
            git commit -m "Update Flyers: $(date +'%Y-%m-%d %H:%M') [skip ci]"
            
            # Reintentos con estrategia de retroceso si GitHub está saturado
            git push origin main || (sleep 30 && git push origin main)
          fi

      - name: Subir a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Desplegar
        uses: actions/deploy-pages@v4