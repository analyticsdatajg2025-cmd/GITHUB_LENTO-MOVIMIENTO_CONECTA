name: Generar Flyers Automaticamente

on:
  schedule:
    - cron: '0 20 * * *' # 3 PM Hora Perú
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  # Soluciona advertencias de Node.js y mejora rendimiento de las Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 

      - name: Instalar librerias
        run: pip install -r requirements.txt 

      - name: Limpiar y Preparar Directorios
        run: |
          mkdir -p docs/flyers
          mkdir -p temp_cache_img
          # Limpiamos localmente para que el script genere archivos frescos
          rm -f docs/flyers/*.pdf 

      - name: Ejecutar Script de Flyers
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
        run: python generar_flyers.py

      - name: Configurar Git para archivos grandes
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      - name: Deploy a GitHub Pages (Estrategia Anti-Error 500)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          # Mantenemos clean en false para evitar que rsync sature el servidor borrando todo
          clean: false 
          # No forzamos single-commit para evitar que el re-empaquetado de git falle en el server
          single-commit: false 
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com

      - name: Subir Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Desplegar a Pages
        uses: actions/deploy-pages@v4